APP_NAME = ForgejoBySanager
APP_SLOGAN = Default Forgejo instance installed via Sanager.
RUN_USER = forgejo
WORK_PATH = /var/lib/forgejo
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/data/forgejo.db

[server]
DOMAIN = localhost
HTTP_ADDR  = 127.0.0.1 # localhost only - use reverse proxy for more complex setup
HTTP_PORT = 11223
ROOT_URL = http://localhost:11223/
LFS_START_SERVER = false
SSH_USER = git

[log]
MODE = console
LEVEL = info
ROOT_PATH = /var/lib/forgejo/log

[repository]
ROOT = /var/lib/forgejo/data/forgejo-repositories

[repository.signing]
DEFAULT_TRUST_MODEL = committer

[service]
DISABLE_REGISTRATION = true
DEFAULT_ENABLE_TIMETRACKING = false

[openid]
ENABLE_OPENID_SIGNIN = false

[session]
PROVIDER = file

[security]
INSTALL_LOCK = true
SECRET_KEY = <verify/add this — see note above>
INTERNAL_TOKEN = __INTERNAL_TOKEN__
PASSWORD_HASH_ALGO = pbkdf2_hi

[oauth2]
JWT_SECRET = __JWT_SECRET__
